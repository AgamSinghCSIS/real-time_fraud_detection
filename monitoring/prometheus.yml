global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
      - targets:
        - 'host.docker.internal:9093'

rule_files:
  - "rules/myrules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'windows-exporter'
    static_configs:
      - targets: ['host.docker.internal:9182']

  - job_name: 'pushgateway'
    static_configs:
      - targets: ['host.docker.internal:9091']

  - job_name: 'bronze_spark_fraud_pipeline'
    static_configs:
      - targets: ['host.docker.internal:4041']

  - job_name: 'silver_spark_fraud_pipeline'
    static_configs:
      - targets: ['host.docker.internal:4042']

  - job_name: 'gold_spark_fraud_pipeline'
    static_configs:
      - targets: ['host.docker.internal:4043']

  - job_name: 'kafka_instance'
    static_configs:
      - targets: ['host.docker.internal:7071']
